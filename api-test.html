<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뽀모 API 점검</title>
<style>body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#fff7fb;color:#2b2b2b;margin:0;padding:20px}.card{max-width:680px;margin:0 auto;background:#fff;border:1px solid #f2d7ea;border-radius:20px;padding:18px;box-shadow:0 14px 42px rgba(78,35,65,.12)}button{border:1px solid #f2d7ea;border-radius:999px;background:#ffd1e8;padding:10px 14px;font-weight:900;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#fff7fb;border:1px dashed #f2d7ea;border-radius:14px;padding:12px}</style>
<script src="./config.js?v=20260801-sheet-read-v4-4-2"></script></head><body><div class="card"><h1>🫧 뽀모 API 점검</h1><p>Apps Script 새 배포가 끝난 뒤 이 버튼을 눌러 <b>ok</b> 응답이 나오면 GitHub 독립형 연결 준비 완료예요. 새 배포 직후에는 첫 응답에 최대 1분가량 걸릴 수 있습니다.</p><button id="btn">API 점검</button><pre id="out">대기 중</pre></div>
<script>
function jsonp(fn,args){return new Promise((resolve,reject)=>{const endpoint=(window.POMO_APP_CONFIG||{}).POMO_APP_URL;const cb='__pomoTest_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const s=document.createElement('script');const finish=(err,p)=>{if(done)return;done=true;clearTimeout(timer);try{s.remove()}catch(e){}try{delete window[cb]}catch(e){};err?reject(err):resolve(p)};window[cb]=(p)=>finish(null,p);s.onerror=()=>finish(new Error('load failed'));s.src=endpoint+(endpoint.includes('?')?'&':'?')+'api=rpc&fn='+encodeURIComponent(fn)+'&args='+encodeURIComponent(JSON.stringify(args||[]))+'&callback='+encodeURIComponent(cb)+'&_t='+Date.now();document.head.appendChild(s);const timer=setTimeout(()=>finish(new Error('timeout')),60000)})}
document.getElementById('btn').onclick=async()=>{const out=document.getElementById('out');out.textContent='점검 중...';try{const p=await jsonp('getActiveUsers',[]);out.textContent=JSON.stringify(p,null,2)}catch(e){out.textContent='ERROR: '+(e.message||e)}};
</script></body></html>
